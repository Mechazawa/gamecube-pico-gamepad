; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

; Adafruit TinyUSB stack: lets us add a custom vendor interface (the Nintendo
; GameCube adapter, 057E:0337) alongside CDC serial. CFG_TUD_VENDOR=0 disables
; the built-in vendor class driver so our app class driver (GcAdapter) handles
; the vendor interface instead. CDC serial keeps the 1200-baud touch reset
; working for host-triggered reflashing (see tools/reflash.sh).
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_VENDOR=0

monitor_speed = 115200