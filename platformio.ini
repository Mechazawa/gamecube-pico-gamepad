; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

; Adafruit TinyUSB stack. The firmware emulates the Nintendo GameCube adapter
; (vendor interface, USB 057E:0337); CFG_TUD_VENDOR=0 disables the built-in
; vendor class driver so our app class driver (GcAdapter) owns it.
;
; GCCPICO_DIAG selects the build profile (defaults to 0 in src/main.cpp):
;   0 = release: GC adapter only (interface 0) -> Dolphin auto-detects it.
;                Reflash via the vendor reboot magic (tools/reflash.sh).
;   1 = debug:   also exposes a USB-CDC serial console for logging + the
;                1200-baud touch reset, but the extra interfaces break
;                Dolphin's interface-0 detection (use for bring-up only).
; Uncomment the line below to build the debug variant.
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_VENDOR=0
    ; -DGCCPICO_DIAG=1

monitor_speed = 115200